name: Build and Release Windows

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.15.0
          cache: npm

      - name: Debug install context
        shell: pwsh
        run: |
          Write-Host "Commit: $env:GITHUB_SHA"
          node -v
          npm -v
          npm config list
          Select-String -Path package-lock.json -Pattern '"@emnapi/core"|"@emnapi/runtime"|"@emnapi/wasi-threads"' | Select-Object -First 20

      - name: Install dependencies
        run: npm ci --include=dev --include=optional --include=peer

      - name: Build Windows x64 package
        run: npm run electron:build -- --win --x64 --publish never

      - name: Create release tag
        id: release_tag
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "win-v${{ github.run_number }}-${{ github.run_attempt }}-$shortSha"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build release name
        id: release_name
        shell: pwsh
        run: |
          $releaseDate = (Get-Date).ToString('yyyy-MM-dd')
          $version = node -p "require('./package.json').version"
          $actor = $env:GITHUB_ACTOR
          $name = "$releaseDate, Version $version (Current), @$actor Latest"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_name.outputs.name }}
          body: |
            Build automatico para Windows x64.
            Commit: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}